# The lab's Warpgate image: upstream's docker/Dockerfile, unchanged, built from this
# branch (an upstream release plus vendored fixes, see vendor/*/PATCHES.md) and pushed
# to the lab's Harbor. Base images and the Dockerfile frontend come through Harbor's
# proxy cache, with the digests upstream pins. Gitea runs only these workflows
# (.gitea/workflows), not .github's.
name: lab-image

on:
  push:
    branches: [main]

env:
  TAG: 0.30.0-beta.2-lab.10

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Base images through Harbor
        env:
          REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
        run: |
          sed -i \
            -e "s#^\# syntax=docker/dockerfile:#\# syntax=${REGISTRY}/dockerhub/docker/dockerfile:#" \
            -e "s#^FROM rust:#FROM ${REGISTRY}/dockerhub/library/rust:#" \
            -e "s#^FROM debian:#FROM ${REGISTRY}/dockerhub/library/debian:#" \
            -e "s#^FROM gcr.io/#FROM ${REGISTRY}/gcr/#" \
            docker/Dockerfile
          grep -nE '^(# syntax|FROM)' docker/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/warpgate:${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=warpgate
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/pennycoders/warpgate
      - name: Digest
        run: echo "warpgate ${TAG} ${{ steps.build.outputs.digest }}"
